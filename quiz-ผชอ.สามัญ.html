<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ข้อสอบปรนัย ผชอ.สามัญ สำหรับอาคารควบคุม</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1220;
      --card: #121a2b;
      --card2: #172033;
      --line: #243049;
      --text: #e8eef8;
      --muted: #9aa8c0;
      --accent: #2dd4bf;
      --accent2: #22c55e;
      --warn: #f59e0b;
      --wrong: #f43f5e;
      --ok: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Prompt", sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(45,212,191,.18), transparent 50%),
        radial-gradient(900px 500px at 100% 0%, rgba(34,197,94,.12), transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 80px; }
    header {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
      margin-bottom: 20px;
    }
    h1 { font-size: 1.35rem; margin: 0 0 6px; line-height: 1.35; }
    .sub { color: var(--muted); font-size: .92rem; }
    .badge {
      background: rgba(45,212,191,.12);
      border: 1px solid rgba(45,212,191,.35);
      color: var(--accent);
      padding: 6px 10px; border-radius: 999px; font-size: .78rem; white-space: nowrap;
    }
    .card {
      background: linear-gradient(180deg, var(--card), var(--card2));
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 40px rgba(0,0,0,.25);
    }
    .progress { height: 8px; background: #1c2638; border-radius: 99px; overflow: hidden; margin: 14px 0 8px; }
    .bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .25s; }
    .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: .85rem; margin-bottom: 16px; }
    .q { font-size: 1.08rem; font-weight: 500; line-height: 1.7; margin-bottom: 16px; }
    .opt {
      display: block; width: 100%; text-align: left;
      background: #101827; border: 1px solid var(--line);
      color: var(--text); border-radius: 12px; padding: 12px 14px;
      margin: 8px 0; cursor: pointer; font-size: .98rem; line-height: 1.55;
    }
    .opt:hover { border-color: var(--accent); }
    .opt.selected { border-color: var(--accent); background: rgba(45,212,191,.08); }
    .opt.correct { border-color: var(--ok); background: rgba(52,211,153,.12); }
    .opt.wrong { border-color: var(--wrong); background: rgba(244,63,94,.12); }
    .opt:disabled { cursor: default; }
    .btns { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    button {
      font-family: inherit; border: 0; border-radius: 12px; padding: 11px 16px;
      cursor: pointer; font-weight: 600;
    }
    .primary { background: var(--accent); color: #042f2e; }
    .ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
    .note { margin-top: 14px; color: var(--muted); font-size: .9rem; line-height: 1.6; display: none; }
    .note.show { display: block; }
    .score { font-size: 2.4rem; font-weight: 700; color: var(--accent); margin: 8px 0; }
    .list { margin-top: 16px; }
    .item { border-top: 1px solid var(--line); padding: 12px 0; font-size: .92rem; }
    .oktxt { color: var(--ok); } .bad { color: var(--wrong); }
    .start-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .hint { color: var(--muted); font-size: .88rem; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>ข้อสอบปรนัย ผชอ.สามัญ<br>สำหรับอาคารควบคุม</h1>
        <div class="sub">สรุปจากเอกสารอบรม พ.ร.บ. ส่งเสริมการอนุรักษ์พลังงาน — 85 ข้อ</div>
      </div>
      <div class="badge">โหมดฝึกทำข้อสอบ</div>
    </header>
    <div class="card" id="app"></div>
  </div>
<script>

const QUESTIONS = RAW.map((row, i) => ({
  id: i + 1,
  q: row[0],
  answer: row[1],
  options: row.slice(1)
}));

let idx = 0;
let answers = Array(QUESTIONS.length).fill(null);
let checked = Array(QUESTIONS.length).fill(false);
let mode = "start";

function $(sel, el=document){ return el.querySelector(sel); }

function render() {
  const app = $("#app");
  if (mode === "start") {
    app.innerHTML = `
      <p style="margin-top:0;line-height:1.7">ชุดนี้แปลงจากเอกสารสรุปการอบรม <b>ผชอ.สามัญ สำหรับอาคารควบคุม</b> จำนวน <b>${QUESTIONS.length} ข้อ</b> เป็นแบบปรนัย 4 ตัวเลือก เพื่อฝึกทำก่อนสอบ</p>
      <ul class="hint" style="line-height:1.8">
        <li>คำตอบหลักอิงจากเอกสารที่แนบ</li>
        <li>ตัวลวงสร้างขึ้นให้ใกล้เคียงเนื้อหาพลังงานอาคาร</li>
        <li>บางข้อในต้นฉบับเป็นคำนวณ/สรุปสั้น จึงคงใจความตามเอกสาร</li>
      </ul>
      <div class="start-actions">
        <button class="primary" onclick="startQuiz()">เริ่มทำข้อสอบ</button>
        <button class="ghost" onclick="startQuiz(true)">สุ่มสลับตัวเลือก</button>
      </div>
    `;
    return;
  }
  if (mode === "result") {
    let score = 0;
    QUESTIONS.forEach((q,i) => { if (answers[i] === q.answer) score++; });
    const pct = Math.round(score / QUESTIONS.length * 100);
    app.innerHTML = `
      <div class="sub">ผลคะแนน</div>
      <div class="score">${score} / ${QUESTIONS.length}</div>
      <div>คิดเป็น ${pct}%</div>
      <div class="btns">
        <button class="primary" onclick="mode='quiz'; idx=0; render()">ดูข้ออีกครั้ง</button>
        <button class="ghost" onclick="resetAll()">เริ่มใหม่</button>
      </div>
      <div class="list">
        ${QUESTIONS.map((q,i)=>`
          <div class="item">
            <b>ข้อ ${i+1}.</b> ${escapeHtml(q.q)}<br>
            คำตอบของคุณ: <span class="${answers[i]===q.answer?'oktxt':'bad'}">${escapeHtml(answers[i] || "ยังไม่ได้ตอบ")}</span><br>
            เฉลย: <span class="oktxt">${escapeHtml(q.answer)}</span>
          </div>
        `).join("")}
      </div>
    `;
    return;
  }
  const q = QUESTIONS[idx];
  const pct = ((idx) / QUESTIONS.length) * 100;
  app.innerHTML = `
    <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
    <div class="meta"><span>ข้อ ${idx+1} จาก ${QUESTIONS.length}</span><span>ตอบแล้ว ${answers.filter(a=>a).length} ข้อ</span></div>
    <div class="q">${idx+1}. ${escapeHtml(q.q)}</div>
    <div id="opts"></div>
    <div class="note" id="note"></div>
    <div class="btns">
      <button class="ghost" onclick="prevQ()" ${idx===0?"disabled":""}>ก่อนหน้า</button>
      <button class="ghost" onclick="checkThis()">เฉลยข้อนี้</button>
      ${idx < QUESTIONS.length-1
        ? `<button class="primary" onclick="nextQ()">ถัดไป</button>`
        : `<button class="primary" onclick="finish()">ตรวจคะแนน</button>`}
    </div>
  `;
  const box = $("#opts");
  q.options.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "opt" + (answers[idx]===opt ? " selected" : "");
    b.textContent = ["ก","ข","ค","ง"][i] + ".  " + opt;
    if (checked[idx]) {
      if (opt === q.answer) b.classList.add("correct");
      else if (answers[idx] === opt) b.classList.add("wrong");
      b.disabled = true;
    } else {
      b.onclick = () => { answers[idx] = opt; render(); };
    }
    box.appendChild(b);
  });
  if (checked[idx]) {
    const note = $("#note");
    note.classList.add("show");
    note.innerHTML = answers[idx] === q.answer
      ? "ถูกต้อง — " + escapeHtml(q.answer)
      : "เฉลย: " + escapeHtml(q.answer);
  }
}

function startQuiz(shuffle=false){
  QUESTIONS.forEach(q => {
    const correct = q.answer;
    let opts = q.options.slice();
    if (shuffle) opts = shuffleArr(opts);
    q.options = opts;
  });
  mode = "quiz"; idx = 0; render();
}
function nextQ(){ if (idx < QUESTIONS.length-1) { idx++; render(); } }
function prevQ(){ if (idx > 0) { idx--; render(); } }
function checkThis(){ checked[idx] = true; render(); }
function finish(){ mode = "result"; render(); }
function resetAll(){
  answers = Array(QUESTIONS.length).fill(null);
  checked = Array(QUESTIONS.length).fill(false);
  mode = "start"; render();
}
function shuffleArr(a){ return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

render();
</script>
