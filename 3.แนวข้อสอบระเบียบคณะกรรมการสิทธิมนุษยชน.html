<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แนวข้อสอบ ระเบียบ กสม. ว่าด้วยพนักงานราชการ พ.ศ. 2561</title>
<style>
:root{
  --paper:#f4f6f8; --card:#ffffff; --ink:#16233f; --ink2:#4a5670; --mute:#7b869c;
  --line:#dde1e9; --gold:#9a7a2b; --gold-bg:#faf4e4;
  --ok:#177a54; --ok-bg:#e9f6f0; --bad:#a92f24; --bad-bg:#fbedeb;
  --thai:"TH Sarabun New","Sarabun","Noto Sans Thai","Leelawadee UI",Tahoma,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);font-family:var(--thai);
  font-size:18px;line-height:1.7;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1060px;margin:0 auto;padding:26px 18px 70px}
.eyebrow{font-size:14px;letter-spacing:.14em;color:var(--gold);font-weight:600}
h1{font-size:clamp(21px,3.4vw,29px);line-height:1.35;margin:6px 0 4px;font-weight:700}
.sub{margin:0;color:var(--ink2);font-size:16px}
.drule{border-top:3px double var(--ink);opacity:.5;margin:18px 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 22px}
.card+.card{margin-top:14px}
h2{font-size:15px;margin:0 0 12px;color:var(--mute);font-weight:700;letter-spacing:.06em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:16px;background:#fff;border:1px solid var(--line);border-radius:4px;
  padding:6px 12px;cursor:pointer;color:var(--ink2)}
.chip .n{font-family:var(--mono);font-size:12px;color:var(--mute);margin-left:6px}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-bg);color:var(--ink);font-weight:600}
.chip[aria-pressed="true"] .n{color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:#fff}
.seg button{font:inherit;font-size:16px;background:transparent;border:0;padding:8px 20px;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;font-weight:600}
.hint{color:var(--mute);font-size:15px;margin:10px 0 0}
.btn{font:inherit;font-size:17px;font-weight:600;background:var(--ink);color:#fff;border:0;
  border-radius:4px;padding:10px 24px;cursor:pointer}
.btn:hover{background:#22315a}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--gold);background:var(--gold-bg)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.grid{display:grid;grid-template-columns:1fr 250px;gap:14px;align-items:start}
@media(max-width:840px){.grid{grid-template-columns:1fr}.rail{order:-1}}
.rail{position:sticky;top:14px}
.qcard{border-left:3px solid var(--gold)}
.qhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:16px}
.qno{font-size:20px;font-weight:700}
.qcat{font-size:14px;color:var(--gold);font-weight:600}
.qsrc{font-family:var(--mono);font-size:12px;color:var(--mute);margin-left:auto}
.qtext{font-size:19px;line-height:1.8;margin:0 0 16px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;text-align:left;font:inherit;font-size:17.5px;line-height:1.65;
  background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 14px;color:var(--ink);
  cursor:pointer;width:100%}
.opt:hover{border-color:var(--ink2)}
.opt .k{font-weight:700;color:var(--mute);min-width:20px}
.opt[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-bg)}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{color:var(--bad)}
.opt:disabled{opacity:1;color:var(--ink)}
.verdictline{margin-top:16px;padding:12px 14px;border-radius:4px;font-size:17px}
.v-ok{background:var(--ok-bg);border:1px solid #bfe0d2;color:#0f5c3f}
.v-no{background:var(--bad-bg);border:1px solid #eec9c4;color:#8a251c}
.note{margin-top:10px;padding:11px 14px;background:var(--gold-bg);border:1px solid #e8d9ac;
  border-radius:4px;font-size:15.5px;color:#5f4a13}
.note b{display:block;font-size:13px;letter-spacing:.06em;margin-bottom:2px}
.meter{height:5px;background:#e7eaf0;border-radius:99px;overflow:hidden;margin:10px 0 2px}
.meter i{display:block;height:100%;background:var(--gold);width:0;transition:width .25s}
.nav{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:12px}
.nav button{font-family:var(--mono);font-size:11px;aspect-ratio:1;border-radius:3px;cursor:pointer;
  background:#fff;border:1px solid var(--line);color:var(--mute);padding:0}
.nav button.done{background:#eef1f6;color:var(--ink);border-color:#c9d0dd}
.nav button.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.nav button.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.nav button.here{outline:2px solid var(--gold);outline-offset:1px}
.legend{font-size:14px;color:var(--mute);margin-top:10px;line-height:1.9}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.stat{font-size:15px;color:var(--ink2)}
.stat b{font-family:var(--mono);color:var(--ink)}
.big{font-family:var(--mono);font-size:54px;line-height:1;font-weight:700}
.verdict{display:inline-block;font-size:15px;font-weight:700;border:1px solid currentColor;
  border-radius:4px;padding:3px 12px}
.pass{color:var(--ok)} .fail{color:var(--bad)}
.bars{display:grid;gap:10px}
.bar .track{height:7px;background:#e7eaf0;border-radius:99px;overflow:hidden;margin-top:4px}
.bar .track i{display:block;height:100%;border-radius:99px}
.bar .meta{font-family:var(--mono);font-size:13px;color:var(--mute)}
.rev{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.rev:first-of-type{border-top:0;padding-top:0;margin-top:0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">แนวข้อสอบ ๑๕๐ ข้อ · เกณฑ์ผ่าน ๗๐%</div>
    <h1>ระเบียบคณะกรรมการสิทธิมนุษยชนแห่งชาติ ว่าด้วยพนักงานราชการสำนักงาน กสม. พ.ศ. 2561 และที่แก้ไขเพิ่มเติม</h1>

  </header>
  <div class="drule"></div>
  <main id="app"></main>
</div>

    </div>
  </section>`;

  app.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { S.mode = b.dataset.mode; renderSetup(); });
  app.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => {
    const k = b.dataset.cat;
    S.cats.has(k) ? S.cats.delete(k) : S.cats.add(k);
    if(!S.cats.size) S.cats.add(k);
    renderSetup();
  });
  document.getElementById("allcat").onclick = () => { S.cats = new Set(Object.keys(CATS)); renderSetup(); };
  app.querySelectorAll("[data-size]").forEach(b => b.onclick = () => {
    S.size = b.dataset.size === "all" ? "all" : +b.dataset.size; renderSetup();
  });
  app.querySelectorAll("[data-order]").forEach(b => b.onclick = () => { S.order = b.dataset.order; renderSetup(); });
  app.querySelectorAll("[data-mix]").forEach(b => b.onclick = () => { S.mixOpts = b.dataset.mix === "mix"; renderSetup(); });
  const st = document.getElementById("start"); if(st) st.onclick = () => start();
}

/* ---------- session ---------- */
function start(pool){
  let src = pool ? pool.slice() : QBANK.filter(q => S.cats.has(q.cat));
  if(!pool){
    src = S.order === "shuffle" ? shuffle(src.slice()) : src.slice().sort((a,b) => a.n - b.n);
    if(S.size !== "all") src = src.slice(0, S.size);
    if(S.order === "source") src.sort((a,b) => a.n - b.n);
  }
  S.items = src.map(q => ({q, order: S.mixOpts ? shuffle([0,1,2,3]) : [0,1,2,3]}));
  S.picks = new Array(src.length).fill(null);
  S.idx = 0; S.elapsed = 0;
  clearInterval(S.timer);
  S.limit = S.mode === "exam" ? src.length * 45 : 0;
  S.timer = setInterval(() => {
    S.elapsed++;
    const el = document.getElementById("clock");
    if(el) el.textContent = S.mode === "exam" ? fmt(Math.max(S.limit - S.elapsed, 0)) : fmt(S.elapsed);
    if(S.mode === "exam" && S.elapsed >= S.limit){ clearInterval(S.timer); finish(true); }
  }, 1000);
  renderQuiz();
}

function renderQuiz(){
  const it = S.items[S.idx], q = it.q, pick = S.picks[S.idx];
  const answered = pick !== null;
  const reveal = S.mode === "practice" && answered;
  const done = S.picks.filter(p => p !== null).length;
  const clock = S.mode === "exam" ? fmt(Math.max(S.limit - S.elapsed, 0)) : fmt(S.elapsed);

  app.innerHTML = `
  <div class="grid">
    <section class="card qcard">
      <div class="qhead">
        <span class="qno">ข้อ ${thai(S.idx+1)}</span>
        <span class="qcat">${esc(catName(q.cat))}</span>
        <span class="qsrc">ต้นฉบับข้อ ${q.n}</span>
      </div>
      <p class="qtext">${esc(q.q)}</p>
      <div class="opts" id="opts">
        ${it.order.map((oi,slot) => {
          let cls = "opt";
          if(reveal){
            if(oi === q.ans) cls += " correct";
            else if(oi === pick) cls += " wrong";
          }
          return `<button class="${cls}" data-i="${oi}" aria-pressed="${oi===pick}" ${reveal?"disabled":""}>
            <span class="k">${LET[slot]}.</span><span>${esc(q.opts[oi])}</span></button>`;
        }).join("")}
      </div>
      ${reveal ? `
        <div class="verdictline ${pick===q.ans?"v-ok":"v-no"}">
          ${pick===q.ans ? "ถูกต้อง" : "ยังไม่ถูก"} — เฉลยคือ <b>${LET[it.order.indexOf(q.ans)]}. ${esc(q.opts[q.ans])}</b>
        </div>
        ${q.note ? `<div class="note"><b>หมายเหตุจากต้นฉบับ</b>${esc(q.note)}</div>` : ""}` : ""}
      <div class="row spread" style="margin-top:18px">
        <button class="btn ghost" id="prev" ${S.idx===0?"disabled":""}>ย้อนกลับ</button>
        ${S.idx === S.items.length-1
          ? `<button class="btn" id="finish">ส่งคำตอบ</button>`
          : `<button class="btn" id="next">ข้อถัดไป</button>`}
      </div>
    </section>

    <aside class="card rail">
      <h2>ความคืบหน้า</h2>
      <div class="row spread">
        <span class="stat">ตอบแล้ว <b>${done}</b>/${S.items.length}</span>
        <span class="stat" id="clock">${clock}</span>
      </div>
      <div class="meter"><i style="width:${done/S.items.length*100}%"></i></div>
      <div class="nav">
        ${S.items.map((x,i) => {
          let c = ""; const p = S.picks[i];
          if(p !== null) c = S.mode === "practice" ? (p === x.q.ans ? "ok" : "bad") : "done";
          if(i === S.idx) c += " here";
          return `<button class="${c}" data-go="${i}" aria-label="ข้อ ${i+1}">${i+1}</button>`;
        }).join("")}
      </div>
      ${S.mode === "practice"
        ? `<div class="legend"><span class="dot" style="background:var(--ok)"></span>ตอบถูก<br>
           <span class="dot" style="background:var(--bad)"></span>ตอบผิด</div>`
        : `<div class="legend">โหมดสอบจริง — เฉลยทั้งหมดหลังส่งคำตอบ</div>`}
      <div style="margin-top:14px"><button class="btn ghost" id="quit" style="width:100%">ออกและตั้งค่าใหม่</button></div>
    </aside>
  </div>`;

  app.querySelectorAll("#opts .opt").forEach(b => b.onclick = () => {
    if(reveal) return;
    S.picks[S.idx] = +b.dataset.i;
    renderQuiz();
  });
  const pv = document.getElementById("prev"); if(pv) pv.onclick = () => { S.idx--; renderQuiz(); };
  const nx = document.getElementById("next"); if(nx) nx.onclick = () => { S.idx++; renderQuiz(); };
  const fn = document.getElementById("finish"); if(fn) fn.onclick = () => finish(false);
  document.getElementById("quit").onclick = () => { clearInterval(S.timer); renderSetup(); };
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { S.idx = +b.dataset.go; renderQuiz(); });
}

document.addEventListener("keydown", e => {
  if(!S.items.length || !document.getElementById("opts")) return;
  if(["1","2","3","4"].includes(e.key)){
    const b = app.querySelectorAll("#opts .opt")[+e.key-1];
    if(b && !b.disabled) b.click();
  }
  if(e.key === "ArrowRight" && S.idx < S.items.length-1){ S.idx++; renderQuiz(); }
  if(e.key === "ArrowLeft" && S.idx > 0){ S.idx--; renderQuiz(); }
});

/* ---------- results ---------- */
function finish(auto){
  const left = S.picks.filter(p => p === null).length;
  if(!auto && left && !confirm(`ยังไม่ได้ตอบ ${left} ข้อ ต้องการส่งคำตอบเลยหรือไม่`)) return;
  clearInterval(S.timer);
  renderResults();
}

function renderResults(){
  const total = S.items.length;
  const correct = S.items.filter((x,i) => S.picks[i] === x.q.ans).length;
  const pct = Math.round(correct/total*100);
  const passed = pct >= PASS;
  const rows = Object.keys(CATS).map(k => {
    const set = S.items.map((x,i) => ({x,i})).filter(o => o.x.q.cat === k);
    const ok = set.filter(o => S.picks[o.i] === o.x.q.ans).length;
    return {k, n:set.length, ok, pct: set.length ? Math.round(ok/set.length*100) : 0};
  }).filter(r => r.n > 0);
  const wrong = S.items.map((x,i) => ({x,i})).filter(o => S.picks[o.i] !== o.x.q.ans);

  app.innerHTML = `
  <section class="card">
    <div class="row spread" style="align-items:flex-end">
      <div>
        <div class="big" style="color:${passed?"var(--ok)":"var(--bad)"}">${pct}%</div>
        <div class="stat" style="margin-top:6px">ตอบถูก <b>${correct}</b> จาก <b>${total}</b> ข้อ · ใช้เวลา <b>${fmt(S.elapsed)}</b></div>
      </div>
      <div style="text-align:right">
        <span class="verdict ${passed?"pass":"fail"}">${passed?"ผ่านเกณฑ์":"ยังไม่ผ่านเกณฑ์"}</span>
        <div class="stat" style="margin-top:8px">เกณฑ์ผ่าน ${PASS}%</div>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>ผลรายหมวด</h2>
    <div class="bars">
      ${rows.map(r => `<div class="bar">
        <div class="row spread"><span>${esc(catName(r.k))}</span><span class="meta">${r.ok}/${r.n} · ${r.pct}%</span></div>
        <div class="track"><i style="width:${r.pct}%;background:${r.pct>=PASS?"var(--ok)":"var(--bad)"}"></i></div>
      </div>`).join("")}
    </div>
  </section>

  <section class="card">
    <h2>ทบทวน${wrong.length?` — ${wrong.length} ข้อที่ตอบผิด`:""}</h2>
    ${wrong.length === 0 ? `<p class="hint" style="margin:0">ตอบถูกทั้งหมดในรอบนี้</p>` :
      wrong.map(o => {
        const q = o.x.q, p = S.picks[o.i];
        return `<div class="rev">
          <div class="qhead" style="border:0;padding:0;margin-bottom:8px">
            <span class="qcat">${esc(catName(q.cat))}</span>
            <span class="qsrc">ต้นฉบับข้อ ${q.n}</span>
          </div>
          <p class="qtext" style="font-size:17.5px;margin-bottom:8px">${esc(q.q)}</p>
          <div class="stat" style="line-height:1.9">
            คำตอบของคุณ: <b style="color:var(--bad)">${p===null?"ไม่ได้ตอบ":LET[p]+". "+esc(q.opts[p])}</b><br>
            เฉลย: <b style="color:var(--ok)">${LET[q.ans]}. ${esc(q.opts[q.ans])}</b>
          </div>
          ${q.note ? `<div class="note"><b>หมายเหตุจากต้นฉบับ</b>${esc(q.note)}</div>` : ""}
        </div>`;
      }).join("")}
  </section>

  <section class="card">
    <div class="row">
      <button class="btn" id="again">ทำชุดเดิมอีกครั้ง</button>
      ${wrong.length?`<button class="btn ghost" id="onlywrong">ทำเฉพาะ ${wrong.length} ข้อที่ผิด</button>`:""}
      <button class="btn ghost" id="home">กลับหน้าตั้งค่า</button>
    </div>
  </section>`;

  const pool = S.items.map(x => x.q);
  document.getElementById("again").onclick = () => start(S.order==="shuffle" ? shuffle(pool.slice()) : pool.slice());
  const ow = document.getElementById("onlywrong");
  if(ow) ow.onclick = () => start(wrong.map(o => o.x.q));
  document.getElementById("home").onclick = renderSetup;
  window.scrollTo({top:0,behavior:"smooth"});
}

renderSetup();
</script>
</body>
</html>
