<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แบบทดสอบ นักวิชาการพลังงาน</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1c2333;--mut:#6b7488;--pri:#1f5fd1;--ok:#17803d;--okbg:#e6f6ec;--bad:#c62828;--badbg:#fdecec;--line:#dde2ec}
@media (prefers-color-scheme:dark){:root{--bg:#10141c;--card:#1a2030;--ink:#e8ecf5;--mut:#98a2b8;--pri:#6ea2ff;--ok:#4cd07f;--okbg:#14301f;--bad:#ff7b7b;--badbg:#3a1a1a;--line:#2b3348}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:820px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0 4px}
.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label.opt{display:block;margin:6px 0}
select,button{font:inherit}
select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 18px;background:var(--pri);color:#fff;font-weight:600}
button.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sp{justify-content:space-between}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;background:var(--pri);width:0}
.q{font-weight:600;margin:0 0 12px}
.ch{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);margin:8px 0;padding:12px 14px;font-weight:400}
.ch:hover:not(:disabled){border-color:var(--pri)}
.ch b{min-width:1.6em;color:var(--pri)}
.ch.sel{border-color:var(--pri);background:rgba(31,95,209,.1)}
.ch.ok{border-color:var(--ok);background:var(--okbg)}
.ch.bad{border-color:var(--bad);background:var(--badbg)}
.exp{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--okbg);border-left:4px solid var(--ok)}
.exp.x{background:var(--badbg);border-color:var(--bad)}
.tag{display:inline-block;font-size:.8rem;color:var(--mut);margin-bottom:6px}
.score{font-size:2.4rem;font-weight:700}
.pass{color:var(--ok)}.fail{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;margin-top:10px}
.grid button{padding:6px 0;background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:400}
.grid button.done{background:rgba(31,95,209,.15);border-color:var(--pri)}
.grid button.ok{background:var(--okbg);border-color:var(--ok)}
.grid button.bad{background:var(--badbg);border-color:var(--bad)}
.grid button.cur{outline:2px solid var(--pri)}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>แบบทดสอบ นักวิชาการพลังงาน (สพจ.)</h1>
<p class="sub">ภารกิจ สพจ. · น้ำมัน/ก๊าซ/ไฟฟ้า · พลังงานทดแทน · กฎหมายพลังงาน · แผนปฏิบัติราชการ 2569</p>

<div id="home" class="card">
  <p><b>เลือกชุดข้อสอบ</b></p>
  <select id="set"></select>
  <p style="margin-top:14px"><b>โหมด</b></p>
  <label class="opt"><input type="radio" name="mode" value="practice" checked> ฝึกทำ – เฉลยและคำอธิบายทันทีหลังตอบ</label>
  <label class="opt"><input type="radio" name="mode" value="exam"> สอบจริง – ดูเฉลยตอนส่งข้อสอบ</label>
  <p style="margin-top:14px"><b>ตัวเลือกเพิ่มเติม</b></p>
  <label class="opt"><input type="checkbox" id="shuf"> สลับลำดับข้อ</label>
  <div class="row" style="margin-top:6px"><span>จำนวนข้อ:</span>
    <select id="cnt" style="width:auto"><option value="0">ทั้งหมดในชุด</option><option value="20">สุ่ม 20 ข้อ</option><option value="50">สุ่ม 50 ข้อ</option><option value="100">สุ่ม 100 ข้อ</option></select></div>
  <p class="sub" style="margin-top:14px">เกณฑ์ผ่าน 70% · ตัวเลือกไม่ถูกสลับ เพราะบางข้อมี “ถูกทุกข้อ / ข้อ ก. และ ข. ถูก”</p>
  <button id="start">เริ่มทำข้อสอบ</button>
</div>

<div id="quiz" class="card hide">
  <div class="row sp"><span id="prog"></span><span id="sc"></span></div>
  <div class="bar"><i id="barfill"></i></div>
  <div id="qbox"></div>
  <div class="row sp" style="margin-top:14px">
    <button class="sec" id="prev">← ก่อนหน้า</button>
    <button id="next">ถัดไป →</button>
  </div>
  <div class="grid" id="nav"></div>
  <div class="row" style="margin-top:14px"><button class="sec" id="submit">ส่งข้อสอบ</button><button class="sec" id="quit">กลับหน้าแรก</button></div>
</div>

<div id="result" class="card hide"></div>
</div>

<script>
var L=['ก','ข','ค','ง'];
// รูปแบบ: คำถาม|ก|ข|ค|ง|เฉลย|คำอธิบาย
var SETS=[
{id:'A1',name:'ชุด A1 – ข้อ 1–50 (ภารกิจ สพจ., น้ำมัน/ก๊าซ/ไฟฟ้า, พลังงานทดแทน, กฎหมาย 5 ฉบับ)',data:`หน่วยงานใดมีหน้าที่หลักในการจัดทำและผลักดัน “แผนพัฒนาพลังงานระดับจังหวัด” ให้บูรณาการเข้ากับแผนพัฒนาจังหวัดและกลุ่มจังหวัด?|กรมพัฒนาพลังงานทดแทนและอนุรักษ์พลังงาน|สำนักงานพลังงานจังหวัด (สังกัดสำนักงานปลัดกระทรวงพลังงาน)|คณะกรรมการกำกับกิจการพลังงาน (กกพ.)|สำนักงานนโยบายและแผนพลังงาน (สนพ.)|ข|ตามลักษณะงานของนักวิชาการพลังงานปฏิบัติการ (ส่วนภูมิภาค) สังกัดสำนักงานปลัดกระทรวงพลังงาน มีหน้าที่ร่วมศึกษา วิเคราะห์ข้อมูล และจัดทำแผนพัฒนาพลังงานระดับจังหวัด เพื่อผลักดันให้บูรณาการกับแผนพัฒนาจังหวัดและกลุ่มจังหวัด
ผู้บังคับบัญชาสูงสุดของสำนักงานพลังงานจังหวัดคือตำแหน่งใด?|ผู้ว่าราชการจังหวัด|พลังงานจังหวัด|ปลัดกระทรวงพลังงาน|อธิบดีกรมพัฒนาพลังงานทดแทนและอนุรักษ์พลังงาน|ข|พลังงานจังหวัดเป็นข้าราชการพลเรือนสามัญที่ดำรงตำแหน่งผู้บังคับบัญชาของสำนักงานพลังงานจังหวัด ซึ่งเป็นราชการบริหารส่วนภูมิภาค สังกัดสำนักงานปลัดกระทรวงพลังงาน
ข้อใด ไม่ใช่ ภารกิจหลักของสำนักงานปลัดกระทรวงพลังงานในส่วนภูมิภาคตามเอกสารแนบท้ายประกาศรับสมัคร?|การจดทะเบียนและรับออกใบทะเบียนผู้ค้าน้ำมันตามมาตรา 10, 11, 12|การประสานการตรวจสอบคุณภาพน้ำมันตามแผนตรวจประจำปี|การอนุมัติงบประมาณลงทุนสร้างโรงไฟฟ้าพลังงานนิวเคลียร์ระดับประเทศ|การส่งเสริมการดำเนินงานด้านความปลอดภัยและสิ่งแวดล้อมของกิจการน้ำมันเชื้อเพลิง|ค|การอนุมัติสร้างโรงไฟฟ้าขนาดใหญ่ระดับประเทศเป็นหน้าที่เชิงนโยบายระดับกระทรวง/คณะรัฐมนตรี ไม่ใช่ภารกิจปฏิบัติงานในระดับภูมิภาคตามที่ระบุในประกาศ
การปฏิบัติตนตาม “ประมวลจริยธรรมข้าราชการพลเรือน” ของนักวิชาการพลังงานมีเป้าหมายเพื่ออะไร?|เพื่อให้สามารถใช้อำนาจเปรียบเทียบปรับได้โดยไม่ต้องรายงานผู้บังคับบัญชา|เพื่อยึดถือเป็นมาตรฐานทางจริยธรรมในการปฏิบัติงานด้วยความซื่อสัตย์ สุจริต และโปร่งใส|เพื่อให้ได้รับการยกเว้นการตรวจสอบจากสำนักงานการตรวจเงินแผ่นดิน|เพื่อเพิ่มอัตราเงินเดือนขึ้นเป็นพิเศษ|ข|ประมวลจริยธรรมข้าราชการพลเรือนมีไว้เพื่อให้ข้าราชการยึดถือปฏิบัติตนด้วยคุณธรรม จริยธรรม ป้องกันการทุจริตและผลประโยชน์ทับซ้อน
วิสัยทัศน์ของกระทรวงพลังงานมุ่งเน้นเรื่องใดเป็นสำคัญ?|การขายพลังงานให้ได้ราคาสูงสุดเพื่อนำรายได้เข้าประเทศ|การสร้างความมั่นคงทางพลังงาน ส่งเสริมการแข่งขัน และการพัฒนาพลังงานที่ยั่งยืนเป็นมิตรต่อสิ่งแวดล้อม|การยกเลิกการใช้น้ำมันเชื้อเพลิงทุกประเภทภายใน 3 ปี|การผูกขาดการผลิตไฟฟ้าโดยหน่วยงานภาครัฐเพียงผู้เดียว|ข|กระทรวงพลังงานมุ่งเน้นการสร้างความมั่นคงด้านพลังงาน ให้มีพลังงานใช้อย่างเพียงพอ ในราคาที่เป็นธรรม และเป็นมิตรต่อสิ่งแวดล้อม
การจัดทำแผนยุทธศาสตร์สำนักงานพลังงานจังหวัด ต้องสอดคล้องกับสิ่งใดมากที่สุด?|แผนบูรณาการระดับจังหวัด และนโยบายพลังงานของประเทศ|ข้อตกลงการค้าเสรีระหว่างประเทศเท่านั้น|ความต้องการของบริษัทเอกชนผู้ค้าน้ำมันในพื้นที่|แผนผังเมืองรวมของกรุงเทพมหานคร|ก|ลักษณะงานข้อ (๑.๕) ระบุว่าต้องวิเคราะห์ข้อมูลองค์กรเพื่อประกอบการจัดทำยุทธศาสตร์ที่สอดคล้องกับแผนบูรณาการระดับจังหวัดและนโยบายพลังงานประเทศ
การบริการประชาชนเกี่ยวกับการให้ข้อมูลข่าวสารด้านพลังงานเบื้องต้น เป็นภารกิจด้านใดของนักวิชาการพลังงาน?|ด้านการวางแผน|ด้านการบริการ|ด้านการค้าน้ำมัน|ด้านการบังคับใช้กฎหมายอาญา|ข|ตามลักษณะงานด้านการบริการ ข้อ (๔.๑) กำหนดให้ให้บริการด้านข้อมูลเบื้องต้นเกี่ยวกับพลังงานแก่หน่วยงานและประชาชน
แผน PDP (Power Development Plan) คือแผนอะไร?|แผนพัฒนาพลังงานทดแทน|แผนพัฒนากำลังผลิตไฟฟ้าของประเทศไทย|แผนจัดหาน้ำมันเชื้อเพลิงสำรอง|แผนอนุรักษ์พลังงานในภาคขนส่ง|ข|PDP คือ Thailand's Power Development Plan หรือแผนพัฒนากำลังผลิตไฟฟ้าของประเทศ
ข้อใดคือเป้าหมายหลักของการนำเทคโนโลยีพลังงานทดแทนไปถ่ายทอดในระดับชุมชน?|เพื่อบังคับให้ชุมชนซื้ออุปกรณ์โซล่าร์เซลล์|เพื่อให้ชุมชนสามารถพึ่งพาตนเองด้านพลังงาน ลดรายจ่าย และเพิ่มประสิทธิภาพการใช้พลังงาน|เพื่อยกเลิกการใช้ไฟฟ้าจากการไฟฟ้าระดับภูมิภาค|เพื่อนำงบประมาณไปใช้อุดหนุนค่าเชื้อเพลิง|ข|การถ่ายทอดเทคโนโลยีและการส่งเสริมศูนย์เรียนรู้ชุมชนช่วยลดค่าใช้จ่ายด้านพลังงานและส่งเสริมการใช้พลังงานอย่างยั่งยืน
ข้อใด ไม่ใช่ รูปแบบการมีส่วนร่วมของภาคประชาชนในการดำเนินงานด้านพลังงานในพื้นที่?|การสร้างเครือข่ายภาคประชาสังคมด้านพลังงาน|การจัดตั้งศูนย์เรียนรู้และให้คำปรึกษาด้านพลังงานชุมชน|การจัดเวทีรับฟังความคิดเห็นเกี่ยวกับแผนพัฒนาพลังงานระดับจังหวัด|การสั่งปิดสถานีบริการน้ำมันโดยกลุ่มประชาชนโดยไม่ต้องผ่านกระบวนการทางกฎหมาย|ง|การใช้อำนาจทางกฎหมายต้องเป็นไปตามขั้นตอนที่กฎหมายกำหนดโดยพนักงานเจ้าหน้าที่ การมีส่วนร่วมภาคประชาชนเน้นการสร้างเครือข่าย ข้อเสนอแนะ และเรียนรู้
แผน EEP (Energy Efficiency Plan) มุ่งเน้นเรื่องใด?|การพัฒนาพลังงานนิวเคลียร์|การเพิ่มประสิทธิภาพและการอนุรักษ์พลังงาน|การส่งเสริมการส่งออกก๊าซธรรมชาติ|การกำหนดราคาน้ำมันดีเซล|ข|EEP คือแผนอนุรักษ์พลังงานของประเทศ (Energy Efficiency Plan)

คณะกรรมการเปรียบเทียบคดีตาม พ.ร.บ. การส่งเสริมการอนุรักษ์พลังงาน ประกอบด้วยผู้ทรงคุณวุฒิในทางกฎหมายจำนวนกี่คน ซึ่งแต่งตั้งโดยใคร?|จำนวน 3 คน แต่งตั้งโดยรัฐมนตรีว่าการกระทรวงพลังงาน|จำนวน 5 คน แต่งตั้งโดยคณะรัฐมนตรี|จำนวน 3 คน แต่งตั้งโดยอธิบดี พพ.|จำนวน 4 คน แต่งตั้งโดยปลัดกระทรวงพลังงาน|ก|`}
];

// ---- parse ----
var LM={'ก':0,'ข':1,'ค':2,'ง':3};
SETS.forEach(function(s){
  s.qs=s.data.split('\n').filter(function(l){return l.trim()}).map(function(l,i){
    var p=l.split('|');
    return {q:p[0].trim(),o:[p[1],p[2],p[3],p[4]].map(function(x){return (x||'').trim()}),a:LM[p[5].trim()],e:(p[6]||'').trim(),n:i+1,set:s.id};
  });
});
var ALL=[].concat.apply([],SETS.map(function(s){return s.qs}));

var $=function(id){return document.getElementById(id)};
var st={list:[],ans:[],idx:0,mode:'practice',done:false,title:''};

(function init(){
  var sel=$('set');
  sel.innerHTML='<option value="ALL">ทุกชุดรวมกัน ('+ALL.length+' ข้อ)</option>'+SETS.map(function(s){return '<option value="'+s.id+'">'+s.name+' ['+s.qs.length+' ข้อ]</option>'}).join('');
})();

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function show(id){['home','quiz','result'].forEach(function(x){$(x).classList.toggle('hide',x!==id)});window.scrollTo(0,0)}

$('start').onclick=function(){
  var v=$('set').value;
  var list=v==='ALL'?ALL.slice():SETS.filter(function(s){return s.id===v})[0].qs.slice();
  if($('shuf').checked)list=shuffle(list);
  var c=parseInt($('cnt').value,10);
  if(c&&c<list.length){list=shuffle(list).slice(0,c)}
  st.list=list;st.ans=new Array(list.length).fill(-1);st.idx=0;st.done=false;
  st.mode=document.querySelector('input[name=mode]:checked').value;
  st.title=$('set').options[$('set').selectedIndex].text;
  show('quiz');render();
};
$('quit').onclick=function(){if(confirm('ออกจากข้อสอบและกลับหน้าแรก?'))show('home')};
$('prev').onclick=function(){if(st.idx>0){st.idx--;render()}};
$('next').onclick=function(){if(st.idx<st.list.length-1){st.idx++;render()}else if(!st.done){submit()}};
$('submit').onclick=submit;

function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function render(){
  var q=st.list[st.idx],a=st.ans[st.idx];
  var reveal=st.done||(st.mode==='practice'&&a>=0);
  var h='<div class="tag">'+esc(q.set)+' · ข้อ '+q.n+'</div><p class="q">'+(st.idx+1)+'. '+esc(q.q)+'</p>';
  q.o.forEach(function(t,i){
    var c='ch';
    if(reveal){if(i===q.a)c+=' ok';else if(i===a)c+=' bad'}
    else if(i===a)c+=' sel';
    h+='<button class="'+c+'" data-i="'+i+'"'+(reveal?' disabled':'')+'><b>'+L[i]+'.</b><span>'+esc(t)+'</span></button>';
  });
  if(reveal){
    var right=a===q.a;
    h+='<div class="exp'+(right?'':' x')+'"><b>'+(a<0?'ไม่ได้ตอบ':right?'ถูกต้อง ✓':'ไม่ถูกต้อง ✗')+'</b> · เฉลย: '+L[q.a]+'.'+(q.e?'<br>'+esc(q.e):'')+'</div>';
  }
  $('qbox').innerHTML=h;
  $('qbox').querySelectorAll('.ch').forEach(function(b){b.onclick=function(){st.ans[st.idx]=+b.dataset.i;render()}});
  var done=st.ans.filter(function(x){return x>=0}).length;
  $('prog').textContent='ข้อ '+(st.idx+1)+' / '+st.list.length+' · ตอบแล้ว '+done;
  $('barfill').style.width=(done/st.list.length*100)+'%';
  if(st.mode==='practice'){var ok=0;st.ans.forEach(function(x,i){if(x===st.list[i].a)ok++});$('sc').textContent='ถูก '+ok}else $('sc').textContent='';
  $('prev').disabled=st.idx===0;
  $('next').textContent=st.idx===st.list.length-1?(st.done?'จบ':'ส่งข้อสอบ'):'ถัดไป →';
  var g='';
  st.list.forEach(function(x,i){
    var c='';var an=st.ans[i];
    if(st.done||(st.mode==='practice'&&an>=0)){c=an===x.a?'ok':(an>=0?'bad':'')}
    else if(an>=0)c='done';
    if(i===st.idx)c+=' cur';
    g+='<button class="'+c+'" data-g="'+i+'">'+(i+1)+'</button>';
  });
  $('nav').innerHTML=g;
  $('nav').querySelectorAll('button').forEach(function(b){b.onclick=function(){st.idx=+b.dataset.g;render()}});
}

function submit(){
  var un=st.ans.filter(function(x){return x<0}).length;
  if(!st.done&&un>0&&!confirm('ยังไม่ได้ตอบ '+un+' ข้อ ต้องการส่งข้อสอบเลยหรือไม่?'))return;
  st.done=true;
  var ok=0;st.ans.forEach(function(x,i){if(x===st.list[i].a)ok++});
  var n=st.list.length,pct=Math.round(ok/n*1000)/10,pass=pct>=70;
  var h='<div class="tag">'+esc(st.title)+'</div><div class="score '+(pass?'pass':'fail')+'">'+ok+' / '+n+' ('+pct+'%)</div>'
   +'<p><b>'+(pass?'ผ่านเกณฑ์ 70% 🎉':'ยังไม่ผ่านเกณฑ์ 70%')+'</b></p>'
   +'<div class="row"><button id="rv">ทบทวนทุกข้อ</button><button class="sec" id="rw">ดูเฉพาะข้อที่ผิด/ไม่ได้ตอบ</button><button class="sec" id="rt">ทำซ้ำเฉพาะข้อที่ผิด</button><button class="sec" id="hm">หน้าแรก</button></div>';
  $('result').innerHTML=h;show('result');
  $('rv').onclick=function(){st.idx=0;show('quiz');render()};
  $('rw').onclick=function(){
    var w=[];st.list.forEach(function(x,i){if(st.ans[i]!==x.a)w.push(i)});
    if(!w.length){alert('ถูกทุกข้อ!');return}
    st.list=w.map(function(i){return st.list[i]});st.ans=w.map(function(i){return st.ans[i]});st.idx=0;show('quiz');render();
  };
  $('rt').onclick=function(){
    var w=st.list.filter(function(x,i){return st.ans[i]!==x.a});
    if(!w.length){alert('ถูกทุกข้อ!');return}
    st.list=shuffle(w);st.ans=new Array(w.length).fill(-1);st.idx=0;st.done=false;show('quiz');render();
  };
  $('hm').onclick=function(){show('home')};
}
</script>
</body>
</html>
