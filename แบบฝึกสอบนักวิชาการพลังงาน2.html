<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แบบฝึกนักวิชาการพลังงาน — พลังงาน & กฎหมายน้ำมันเชื้อเพลิง</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2328;--mute:#6b7075;--line:#e3e0d8;--acc:#c2541a;--ok:#1f7a4d;--okbg:#e6f4ec;--bad:#b42318;--badbg:#fdecea}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1f2226;--ink:#e8e6e1;--mute:#9aa0a6;--line:#30343a;--acc:#f08a4b;--ok:#4cc38a;--okbg:#17382a;--bad:#ff7b72;--badbg:#3d1d1b}}
*{box-sizing:border-box}
body{margin:0;font-family:Sarabun,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.45rem;margin:4px 0 2px}
.sub{color:var(--mute);font-size:.92rem;margin-bottom:16px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:.92rem}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.92rem}
.bar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;font:inherit;font-size:.9rem}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
.prog>div{height:100%;background:var(--acc);width:0;transition:width .25s}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 12px;margin-bottom:14px}
.qh{display:flex;gap:8px;align-items:baseline;margin-bottom:10px}
.num{font-weight:700;color:var(--acc);min-width:2.2em}
.tag{font-size:.75rem;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:auto;white-space:nowrap}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:9px 12px;margin:6px 0;cursor:pointer;font:inherit}
.opt:hover:not([disabled]){border-color:var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.opt[disabled]{cursor:default}
.exp{display:none;margin-top:10px;padding:10px 12px;border-left:3px solid var(--acc);background:var(--bg);border-radius:6px;font-size:.93rem}
.exp.show{display:block}
.score{position:sticky;bottom:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.res{background:var(--card);border:2px solid var(--acc);border-radius:14px;padding:18px;margin-bottom:14px;display:none}
.res.show{display:block}
.big{font-size:2rem;font-weight:700}
.pass{color:var(--ok)}.fail{color:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <h1>แบบฝึกสอบนักวิชาการพลังงานปฏิบัติการ</h1>
  <div class="sub">6 ชุด รวม 120 ข้อ · ความรู้พลังงาน + กฎหมายพลังงาน 5 ฉบับ · เกณฑ์ผ่าน 70%</div>
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <label><input type="checkbox" id="shuf"> สลับลำดับข้อ</label>
    <label><input type="checkbox" id="wrongOnly"> เฉพาะข้อที่เคยตอบผิด</label>
    <button class="btn" id="reset">เริ่มใหม่</button>
  </div>
  <div class="prog"><div id="pg"></div></div>
  <div class="res" id="res"></div>
  <div id="list"></div>
  <div class="score"><span id="sc">0 / 0</span><button class="btn pri" id="finish">ดูผลคะแนน</button></div>
</div>
<script>
const SETS={E:"ความรู้พลังงาน",T:"พ.ร.บ.การค้าน้ำมันฯ 2543",C:"พ.ร.บ.ควบคุมน้ำมันฯ 2542",N:"พ.ร.บ.อนุรักษ์พลังงาน 2535",P:"พ.ร.บ.ประกอบกิจการพลังงาน 2550",F:"พ.ร.บ.กองทุนน้ำมันฯ 2562"};

const Q=[
["T","พ.ร.บ.การค้าน้ำมันเชื้อเพลิง พ.ศ. 2543 ตราขึ้นโดยคำแนะนำและยินยอมขององค์กรใด",["รัฐสภา","สภานิติบัญญัติแห่งชาติ","สภาร่างรัฐธรรมนูญ","สภาผู้แทนราษฎร"],0,"ตราโดยคำแนะนำและยินยอมของรัฐสภา"],
["T","พ.ร.บ.การค้าน้ำมันเชื้อเพลิงฯ มีผลใช้บังคับเมื่อใด นับจากวันประกาศในราชกิจจานุเบกษา",["พ้น 60 วัน","พ้น 120 วัน","พ้น 160 วัน","พ้น 180 วัน"],0,"มาตรา 2 — ใช้บังคับเมื่อพ้นกำหนด 60 วันนับแต่วันประกาศ (เฉลยในหนังสือตอบ ก.)"],
["T","พ.ร.บ.การค้าน้ำมันเชื้อเพลิงฯ ไม่ใช้บังคับกับหน่วยงานใด",["กระทรวง","ทบวง","กรม","ถูกทุกข้อ"],3,"มาตรา 5 — ไม่ใช้บังคับแก่กระทรวง ทบวง กรม"],
["T","ผู้ค้าน้ำมันที่ต้องขอใบอนุญาตจากรัฐมนตรี คือผู้ที่มีปริมาณการค้า (แต่ละชนิดหรือรวมทุกชนิด) ตั้งแต่เท่าใดต่อปี",["100,000 เมตริกตันขึ้นไป","150,000 เมตริกตันขึ้นไป","200,000 เมตริกตันขึ้นไป","300,000 เมตริกตันขึ้นไป"],0,"มาตรา 7 — 100,000 เมตริกตัน/ปี (โน้ต: ถ้าเป็นก๊าซ เกณฑ์ 50,000 เมตริกตัน)"],
["T","ผู้ค้าน้ำมันตามมาตรา 7 ที่จะเลิกกิจการ ต้องแจ้งรัฐมนตรีล่วงหน้าอย่างน้อยกี่วัน",["30 วัน","60 วัน","90 วัน","120 วัน"],2,"มาตรา 9 — แจ้งล่วงหน้าไม่น้อยกว่า 90 วัน"],
["T","ผู้ค้าน้ำมันที่ประกอบกิจการในรูปแบบสถานีบริการ ต้องยื่นขอจดทะเบียนต่อใคร",["นายกรัฐมนตรี","รัฐมนตรีว่าการกระทรวงพลังงาน","อธิบดีกรมธุรกิจพลังงาน","ปลัดกระทรวงพลังงาน"],2,"มาตรา 11 — จดทะเบียนต่ออธิบดีกรมธุรกิจพลังงาน"],

["E","ความหมายของ \"พลังงาน\" ที่ถูกต้องที่สุดคือข้อใด",["ปริมาณเชื้อเพลิงที่ใช้ผลิตไฟฟ้า","ความสามารถในการทำงานหรือทำให้เกิดการเปลี่ยนแปลง","ปริมาณกระแสไฟฟ้าที่ไหลในตัวนำ","ทรัพยากรธรรมชาติทุกชนิดที่มนุษย์ใช้"],1,"ในทางวิทยาศาสตร์ พลังงานคือความสามารถในการทำงาน เช่น ความร้อนทำให้น้ำร้อนขึ้น ไฟฟ้าทำให้มอเตอร์หมุน"],
["E","ข้อใดเป็นตัวอย่าง \"พลังงานปฐมภูมิ\" ได้ชัดเจนที่สุด",["ไฟฟ้าจากโรงไฟฟ้า","น้ำมันเบนซินจากโรงกลั่น","ก๊าซธรรมชาติที่ขุดขึ้นจากใต้ดิน","ไฮโดรเจนที่ผลิตด้วยไฟฟ้า"],2,"พลังงานปฐมภูมิได้มาจากธรรมชาติโดยตรงก่อนแปรรูป ส่วนไฟฟ้า เบนซิน ไฮโดรเจน เป็นพลังงานที่แปรรูปแล้ว (ทุติยภูมิ)"],
["E","ถ้าต้องการเปรียบเทียบปริมาณพลังงานของเชื้อเพลิงต่างชนิดกัน ควรใช้เกณฑ์ใด",["ราคาขายต่อหน่วย","น้ำหนักของเชื้อเพลิงเท่านั้น","ค่าความร้อน (Heating/Calorific Value)","สีและสถานะ"],2,"ค่าความร้อนบอกว่าเชื้อเพลิง 1 หน่วยน้ำหนัก/ปริมาตรให้พลังงานเท่าใด (เช่น kJ/kg)"],
["E","กฎการอนุรักษ์พลังงานในทางฟิสิกส์หมายถึงข้อใด",["สร้างพลังงานใหม่ได้ตลอดเวลา","พลังงานสูญหายได้เมื่อเครื่องจักรประสิทธิภาพต่ำ","พลังงานสร้างหรือทำลายไม่ได้ แต่เปลี่ยนรูปได้","พลังงานทุกชนิดเปลี่ยนเป็นไฟฟ้าได้ทั้งหมดโดยไม่สูญเสีย"],2,"พลังงานรวมในระบบคงที่ แค่เปลี่ยนรูป บางส่วนกลายเป็นความร้อนที่นำมาใช้ประโยชน์ไม่ได้เต็มที่"],
["E","คำว่า \"ปิโตรเลียม\" ครอบคลุมสิ่งใดได้ครบที่สุด",["น้ำมันเบนซินอย่างเดียว","น้ำมันดิบและก๊าซธรรมชาติที่เกิดตามธรรมชาติ","น้ำมันหล่อลื่นทุกชนิด","เชื้อเพลิงที่ผลิตจากพืช"],1,"ปิโตรเลียมคือไฮโดรคาร์บอนใต้ชั้นหิน ทั้งรูปของเหลว (น้ำมันดิบ) และรูปก๊าซ (ก๊าซธรรมชาติ)"],

["E","ข้อใดกล่าวถึงน้ำมันดีเซลได้ถูกต้อง",["ใช้ค่าออกเทนวัดคุณภาพการจุดระเบิด","ใช้ค่าซีเทนเป็นตัวชี้วัดคุณภาพการจุดระเบิด","ใช้กับเครื่องยนต์สันดาปภายในไม่ได้","จุดเดือดต่ำกว่าเบนซินเสมอ"],1,"ค่าซีเทน (Cetane) สูง = ติดไฟง่ายและเร็วหลังฉีดเข้าห้องเผาไหม้ สตาร์ทง่าย เสียงน็อกน้อย (ออกเทนใช้กับเบนซิน)"],
["E","ถ้าราคาน้ำมันดิบโลกขึ้นต่อเนื่อง และปัจจัยอื่นคงที่ ผลระยะสั้นที่สมเหตุสมผลที่สุดคือ",["ต้นทุนการผลิตและขนส่งมีแนวโน้มสูงขึ้น","ค่าไฟทุกประเภทลดลงทันที","พลังงานสำรองของประเทศเพิ่มขึ้นเอง","ประชาชนใช้พลังงานมากขึ้นเสมอ"],0,"น้ำมันเป็นปัจจัยการผลิตพื้นฐาน ต้นทุนเชื้อเพลิงสูง → ค่าขนส่ง/โลจิสติกส์ และต้นทุนสินค้าสูงตาม"],
["E","องค์ประกอบหลักของก๊าซธรรมชาติคือ",["มีเทน","โพรเพน","บิวเทน","ไฮโดรเจน"],0,"มีเทน (CH₄) ประมาณ 70–90% โมเลกุลเล็กและเบาที่สุด จึงเป็นก๊าซที่อุณหภูมิ/ความดันปกติ"],
["E","ความแตกต่างระหว่าง LPG กับ NGV ข้อใดถูกต้องที่สุด",["LPG ส่วนใหญ่เป็นมีเทน NGV เป็นโพรเพน","LPG ส่วนใหญ่เป็นโพรเพนและบิวเทน ส่วน NGV มีมีเทนเป็นหลัก","ทั้งสองเป็นก๊าซชนิดเดียวกันทุกประการ","NGV ผลิตจากน้ำมันพืชเท่านั้น"],1,"LPG = โพรเพน+บิวเทน เก็บเป็นของเหลว หนักกว่าอากาศ (ตกลงต่ำ) · NGV = มีเทน อัดความดันสูง (CNG) เบากว่าอากาศ (ลอยขึ้น)"],
["E","ทำไม LPG จึงบรรจุถังในสถานะของเหลวได้",["เพราะลดอุณหภูมิถึง 0°C เสมอ","เพราะเพิ่มความดันที่เหมาะสมแล้วกลายเป็นของเหลว","เพราะเป็นของเหลวที่อุณหภูมิห้องอยู่แล้ว","เพราะเติมน้ำเข้าไปผสม"],1,"อัดความดันปานกลาง (~4–7 เท่าบรรยากาศ) ที่อุณหภูมิห้องก็เป็นของเหลว ปริมาตรลดลงราว 250 เท่า"],
["E","ก๊าซเชื้อเพลิงรั่วในพื้นที่ปิด ความเสี่ยงสำคัญที่สุดคือ",["ก๊าซสะสมแล้วติดไฟหรือระเบิดเมื่อมีประกายไฟ","ห้องเย็นจนเป็นน้ำแข็งเสมอ","ไฟฟ้าในอาคารดับทันที","ไม่มีความเสี่ยงถ้ามองไม่เห็นเปลวไฟ"],0,"ก๊าซผสมอากาศถึงช่วงติดไฟได้ ประกายจากสวิตช์หรือไฟฟ้าสถิตก็จุดระเบิดได้ และอาจแทนที่ออกซิเจนทำให้ขาดอากาศหายใจ"],
["E","kW กับ kWh ต่างกันอย่างไร",["kW เป็นหน่วยพลังงาน kWh เป็นหน่วยแรงดัน","kW เป็นหน่วยกำลัง kWh เป็นหน่วยพลังงาน","เป็นหน่วยเดียวกัน","kW ใช้กับไฟกระแสตรงเท่านั้น"],1,"kW = อัตราการใช้พลังงาน (กำลัง) · kWh = พลังงานที่ใช้จริง = kW × ชั่วโมง (ที่เรียกว่า \"หน่วย\" ในบิลค่าไฟ)"],

["F","ข้าราชการ/ลูกจ้างของ สป.พน. ธพ. ชธ. พพ. หรือ สนพ. ที่ประสงค์จะเปลี่ยนไปเป็นเจ้าหน้าที่หรือลูกจ้างของสำนักงานกองทุนฯ ต้องแจ้งเป็นหนังสือภายในกี่วันนับแต่ พ.ร.บ.ใช้บังคับ",["60 วัน","90 วัน","120 วัน","180 วัน"],3,"มาตรา 52 — ภายใน 180 วัน"]
];
Q.forEach((q,i)=>q.id=i);
const L=["ก","ข","ค","ง"];
let cur="ALL",answers={},order=[];
const st={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let wrongBank=st.get("eq_wrong",{});
const $=s=>document.querySelector(s);
function tabs(){const t=$("#tabs");t.innerHTML="";[["ALL","ทั้งหมด ("+Q.length+")"],...Object.entries(SETS).map(([k,v])=>[k,v+" ("+Q.filter(q=>q[0]==k).length+")"])].forEach(([k,v])=>{const b=document.createElement("button");b.className="tab"+(k==cur?" on":"");b.textContent=v;b.onclick=()=>{cur=k;build()};t.appendChild(b)})}
function build(){tabs();answers={};$("#res").className="res";
 let qs=Q.filter(q=>cur=="ALL"||q[0]==cur);
 if($("#wrongOnly").checked)qs=qs.filter(q=>wrongBank[q.id]);
 if($("#shuf").checked){qs=qs.slice();for(let i=qs.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[qs[i],qs[j]]=[qs[j],qs[i]]}}
 order=qs;const list=$("#list");list.innerHTML=qs.length?"":"<div class='q'>ยังไม่มีข้อที่เคยตอบผิดในชุดนี้ 🎉</div>";
 qs.forEach((q,n)=>{const d=document.createElement("div");d.className="q";
  d.innerHTML=`<div class="qh"><span class="num">${n+1}.</span><span>${q[1]}</span><span class="tag">${SETS[q[0]]}</span></div>`;
  q[2].forEach((o,k)=>{const b=document.createElement("button");b.className="opt";b.textContent=L[k]+". "+o;b.onclick=()=>pick(q,k,d);d.appendChild(b)});
  const e=document.createElement("div");e.className="exp";e.innerHTML="<b>เฉลย "+L[q[3]]+".</b> "+q[4];d.appendChild(e);list.appendChild(d)});
 upd()}
function pick(q,k,d){if(q.id in answers)return;answers[q.id]=k;const bs=d.querySelectorAll(".opt");
 bs.forEach((b,i)=>{b.disabled=true;if(i==q[3])b.classList.add("ok");else if(i==k)b.classList.add("bad")});
 d.querySelector(".exp").classList.add("show");
 if(k!=q[3])wrongBank[q.id]=1;else delete wrongBank[q.id];st.set("eq_wrong",wrongBank);upd()}
function upd(){const done=Object.keys(answers).length,c=order.filter(q=>answers[q.id]===q[3]).length;
 $("#sc").textContent=`ตอบแล้ว ${done}/${order.length} · ถูก ${c}`;$("#pg").style.width=(order.length?done/order.length*100:0)+"%"}
$("#finish").onclick=()=>{const tot=order.length;if(!tot)return;const c=order.filter(q=>answers[q.id]===q[3]).length,done=Object.keys(answers).length,p=Math.round(c/tot*100),ok=p>=70;
 const by=Object.keys(SETS).map(k=>{const s=order.filter(q=>q[0]==k);if(!s.length)return"";return`<div>${SETS[k]}: ${s.filter(q=>answers[q.id]===q[3]).length}/${s.length}</div>`}).join("");
 const r=$("#res");r.innerHTML=`<div class="big ${ok?"pass":"fail"}">${p}% — ${ok?"ผ่าน":"ยังไม่ผ่าน"}</div><div>ถูก ${c} จาก ${tot} ข้อ (ยังไม่ตอบ ${tot-done} ข้อ) · เกณฑ์ 70%</div><div style="margin-top:8px;color:var(--mute);font-size:.9rem">${by}</div>`;r.className="res show";window.scrollTo({top:0,behavior:"smooth"})};
$("#reset").onclick=build;$("#shuf").onchange=build;$("#wrongOnly").onchange=build;
build();
</script>
</body>
</html>
