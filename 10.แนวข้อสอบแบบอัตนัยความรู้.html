<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แนวข้อสอบอัตนัย — หน้าที่ อำนาจ และภารกิจของ กสม.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@500;700&family=Sarabun:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141C2E;
  --ink-soft:#3D4A63;
  --muted:#7B8699;
  --paper:#F4F2EC;
  --card:#FFFFFF;
  --line:#DFDBD1;
  --jade:#1E7A6B;
  --jade-dim:#E4F0ED;
  --amber:#B8860B;
  --amber-dim:#FBF1DA;
  --rust:#A8332A;
  --rust-dim:#F8E7E5;
  --radius:4px;
  --shadow:0 1px 2px rgba(20,28,46,.06), 0 8px 24px rgba(20,28,46,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Sarabun',-apple-system,'Leelawadee UI','Tahoma',sans-serif;
  font-size:16px;line-height:1.75;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Noto Serif Thai','Sarabun',serif;font-weight:700;line-height:1.4;margin:0}
.mono{font-family:'IBM Plex Mono',monospace}
.wrap{max-width:820px;margin:0 auto;padding:0 20px}
.eyebrow{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  font-family:'IBM Plex Mono',monospace;color:var(--muted);
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{
  outline:2px solid var(--jade);outline-offset:2px;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 22px;border-radius:var(--radius);font-weight:600;
  border:1px solid transparent;transition:background .15s,border-color .15s,color .15s;
}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#26324c}
.btn-ghost{border-color:var(--line);background:var(--card);color:var(--ink-soft)}
.btn-ghost:hover{border-color:var(--ink-soft);color:var(--ink)}
.btn-jade{background:var(--jade);color:#fff}
.btn-jade:hover{background:#176154}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---------- start screen ---------- */
.start{padding:64px 0 80px}
.start .rule{height:3px;background:var(--ink);width:56px;margin-bottom:22px}
.start h1{font-size:31px;letter-spacing:-.01em}
.start .sub{color:var(--ink-soft);margin-top:14px;max-width:60ch}
.meta{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.meta div{font-size:14px;color:var(--muted)}
.meta b{display:block;font-family:'IBM Plex Mono',monospace;font-size:20px;color:var(--ink);font-weight:600}
.opts{margin-top:36px;display:grid;gap:14px}
.optrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.optrow>span{font-size:13px;color:var(--muted);min-width:96px}
.chip{
  padding:8px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);
  font-size:14px;color:var(--ink-soft);transition:all .15s;
}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.modecard{
  border:1px solid var(--line);background:var(--card);border-radius:var(--radius);
  padding:16px 18px;text-align:left;flex:1 1 240px;transition:border-color .15s,box-shadow .15s;
}
.modecard[aria-pressed="true"]{border-color:var(--jade);box-shadow:inset 0 0 0 1px var(--jade)}
.modecard b{display:block;font-weight:700;margin-bottom:2px}
.modecard small{color:var(--muted);font-size:13px;line-height:1.5;display:block}
.note{
  margin-top:30px;padding:14px 16px;background:var(--amber-dim);
  border-left:3px solid var(--amber);font-size:14px;color:#6E520B;border-radius:0 var(--radius) var(--radius) 0;
}

/* ---------- quiz chrome ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(244,242,236,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:58px}
.pill{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap}
.pill.exam{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{flex:1;height:5px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--jade);width:0;transition:width .3s ease}
.topcount{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);white-space:nowrap}
.iconbtn{padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:13px;background:var(--card);color:var(--ink-soft)}

/* ---------- question card ---------- */
.qwrap{padding:30px 0 120px}
.qhead{display:flex;align-items:baseline;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.qnum{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--jade);font-weight:600}
.qtext{font-size:21px;font-family:'Noto Serif Thai',serif;font-weight:500;line-height:1.65;margin-bottom:20px}
textarea{
  width:100%;min-height:190px;padding:16px 18px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--card);font-family:inherit;font-size:16px;line-height:1.8;color:var(--ink);resize:vertical;
}
textarea::placeholder{color:#B6BDC9}
textarea:disabled{background:#FAF9F6;color:var(--ink-soft)}

/* signature: keyword meter */
.keys{margin-top:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden}
.keys-head{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);gap:10px}
.keys-head b{font-size:13px;font-weight:600;color:var(--ink-soft)}
.cov{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted)}
.keys-body{display:flex;flex-wrap:wrap;gap:8px;padding:14px}
.kw{
  font-size:13px;padding:5px 12px;border-radius:999px;border:1px dashed var(--line);
  color:var(--muted);background:#FBFAF7;transition:all .2s;
}
.kw.hit{border-style:solid;border-color:var(--jade);background:var(--jade-dim);color:var(--jade);font-weight:600}
.kw.hit::before{content:"✓ ";}
.keys.masked .kw{filter:blur(5px);user-select:none}

.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.spacer{flex:1}

/* model answer */
.model{margin-top:22px;border:1px solid var(--line);border-left:3px solid var(--ink);background:var(--card);border-radius:0 var(--radius) var(--radius) 0;padding:18px 20px}
.model .eyebrow{margin-bottom:8px;display:block}
.model p{margin:0;color:var(--ink-soft)}
.selfgrade{margin-top:18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);padding:16px 18px}
.selfgrade p{margin:0 0 12px;font-size:14px;color:var(--ink-soft)}
.gbtns{display:flex;flex-wrap:wrap;gap:10px}
.gbtn{padding:10px 20px;border:1px solid var(--line);border-radius:var(--radius);font-weight:600;background:#fff;color:var(--ink-soft)}
.gbtn.ok[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:#fff}
.gbtn.no[aria-pressed="true"]{background:var(--rust);border-color:var(--rust);color:#fff}
.hintline{font-size:13px;color:var(--muted);margin-top:10px}

/* navigator */
.navdrawer{
  position:fixed;inset:0;z-index:60;background:rgba(20,28,46,.42);
  display:none;align-items:flex-end;justify-content:center;
}
.navdrawer.open{display:flex}
.navpanel{background:var(--paper);width:100%;max-width:820px;max-height:82vh;overflow:auto;border-radius:10px 10px 0 0;padding:22px}
.navpanel h3{font-size:17px;margin-bottom:4px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:12px 0 18px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px}
.gitem{
  aspect-ratio:1;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);
  font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--ink-soft);
  display:flex;align-items:center;justify-content:center;
}
.gitem.written{background:var(--amber-dim);border-color:#E5C87E;color:#6E520B}
.gitem.ok{background:var(--jade-dim);border-color:var(--jade);color:var(--jade);font-weight:600}
.gitem.no{background:var(--rust-dim);border-color:var(--rust);color:var(--rust);font-weight:600}
.gitem.cur{box-shadow:0 0 0 2px var(--ink);}

/* ---------- results ---------- */
.res{padding:52px 0 90px}
.verdict{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:34px 30px;box-shadow:var(--shadow);text-align:center}
.verdict.pass{border-top:5px solid var(--jade)}
.verdict.fail{border-top:5px solid var(--rust)}
.verdict h2{font-size:26px;margin-bottom:6px}
.verdict.pass h2{color:var(--jade)}
.verdict.fail h2{color:var(--rust)}
.score{font-family:'IBM Plex Mono',monospace;font-size:64px;font-weight:600;line-height:1.1;letter-spacing:-.02em}
.scoresub{color:var(--muted);font-size:14px;margin-top:2px}
.passline{margin-top:20px;height:8px;background:var(--line);border-radius:99px;position:relative;overflow:visible}
.passline i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--jade)}
.passline.fail i{background:var(--rust)}
.passline b{position:absolute;top:-7px;bottom:-7px;left:70%;width:2px;background:var(--ink)}
.passline span{position:absolute;top:14px;left:70%;transform:translateX(-50%);font-size:11px;color:var(--ink);white-space:nowrap;font-family:'IBM Plex Mono',monospace}
.breakdown{margin-top:60px}
.breakdown h3{font-size:17px;margin-bottom:14px}
.catrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.catrow .cname{flex:1;color:var(--ink-soft)}
.catbar{width:100px;height:6px;background:var(--line);border-radius:99px;overflow:hidden;flex:none}
.catbar i{display:block;height:100%;background:var(--jade)}
.catnum{font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--muted);width:52px;text-align:right;flex:none}
.reviewlist{margin-top:44px}
.reviewlist h3{font-size:17px;margin-bottom:14px}
.rev{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.rev summary{padding:14px 16px;cursor:pointer;list-style:none;display:flex;gap:12px;align-items:flex-start;font-weight:600;font-size:15px}
.rev summary::-webkit-details-marker{display:none}
.rev summary .tag{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:2px 8px;border-radius:99px;flex:none;margin-top:3px}
.rev.no summary .tag{background:var(--rust-dim);color:var(--rust)}
.rev.ok summary .tag{background:var(--jade-dim);color:var(--jade)}
.revbody{padding:0 16px 18px;border-top:1px solid var(--line);padding-top:14px}
.revbody h4{margin:0 0 6px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-family:'IBM Plex Mono',monospace;color:var(--muted);font-weight:400}
.revbody .mine{background:#FBFAF7;border:1px solid var(--line);padding:12px 14px;border-radius:var(--radius);white-space:pre-wrap;color:var(--ink-soft);font-size:15px}
.revbody .theirs{color:var(--ink-soft);margin:0}
.revbody .block+ .block{margin-top:16px}
.resact{display:flex;flex-wrap:wrap;gap:10px;margin-top:40px}

/* grading screen */
.gradehead{padding:44px 0 8px}
.gradehead h2{font-size:24px}
.gradehead p{color:var(--ink-soft);margin:8px 0 0;max-width:62ch}
.gcard{border:1px solid var(--line);background:var(--card);border-radius:var(--radius);padding:20px;margin-top:16px}
.gcard .qtext{font-size:18px;margin-bottom:14px}

@media (max-width:640px){
  .start{padding:44px 0 60px}
  .start h1{font-size:25px}
  .qtext{font-size:19px}
  .score{font-size:52px}
  .optrow>span{min-width:100%}
  .topbar .wrap{gap:9px}
  .wrap{padding:0 16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div id="app"></div>

<div class="navdrawer" id="navdrawer">
  <div class="navpanel">
    <h3>ผังข้อสอบ</h3>
    <div class="legend">
      <span><i style="background:#fff"></i>ยังไม่ตอบ</span>
      <span><i style="background:var(--amber-dim);border-color:#E5C87E"></i>เขียนแล้ว</span>
      <span><i style="background:var(--jade-dim);border-color:var(--jade)"></i>ได้คะแนน</span>
      <span><i style="background:var(--rust-dim);border-color:var(--rust)"></i>ไม่ได้คะแนน</span>
    </div>
    <div class="grid" id="navgrid"></div>
    <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-ghost" onclick="closeNav()">ปิด</button>
      <button class="btn btn-primary" id="navfinish" onclick="finishFromNav()">ส่งคำตอบทั้งหมด</button>
    </div>
  </div>
</div>

<script>
const QUESTIONS_A = [
{
  id: 1,
  cat: "สถานะและความสำคัญของ กสม.",
  q: "อธิบายความสำคัญของคณะกรรมการสิทธิมนุษยชนแห่งชาติ (กสม.) ต่อการคุ้มครองสิทธิของประชาชน",
  a: "คณะกรรมการสิทธิมนุษยชนแห่งชาติเป็นองค์กรอิสระตามรัฐธรรมนูญที่มีบทบาทสำคัญในการคุ้มครอง ส่งเสริม และเฝ้าระวังการละเมิดสิทธิมนุษยชนของประเทศ กสม. ช่วยทำให้ประชาชนได้รับความเป็นธรรมเมื่อถูกละเมิดสิทธิจากหน่วยงานของรัฐหรือภาคเอกชน อีกทั้งยังเป็นกลไกสำคัญในการสร้างมาตรฐานสิทธิมนุษยชนของประเทศให้สอดคล้องกับหลักสากล จึงเป็นองค์กรที่ช่วยเสริมความมั่นคงทางกฎหมาย ความยุติธรรม และความน่าเชื่อถือของประเทศในเวทีระหว่างประเทศ",
  keys: ["องค์กรอิสระ", "รัฐธรรมนูญ", "คุ้มครอง", "ส่งเสริม", "เฝ้าระวัง", "หลักสากล|มาตรฐานสากล"]
},
{
  id: 2,
  cat: "สถานะและความสำคัญของ กสม.",
  q: "เหตุใดคณะกรรมการสิทธิมนุษยชนแห่งชาติจึงต้องดำรงความเป็นอิสระ",
  a: "ความเป็นอิสระเป็นหัวใจของ กสม. เพราะหากองค์กรนี้ถูกแทรกแซงจากฝ่ายบริหาร นิติบัญญัติ หรือตุลาการ การตรวจสอบการละเมิดสิทธิมนุษยชนอาจไม่เป็นกลาง การมีสถานะเป็นองค์กรอิสระทำให้ กสม. สามารถตรวจสอบหน่วยงานต่าง ๆ ได้อย่างเปิดเผย เที่ยงธรรม และปราศจากอิทธิพลทางการเมือง ส่งผลให้การคุ้มครองสิทธิของประชาชนมีประสิทธิภาพมากขึ้น",
  keys: ["แทรกแซง", "ฝ่ายบริหาร", "นิติบัญญัติ", "ตุลาการ", "เป็นกลาง|เที่ยงธรรม", "อิทธิพลทางการเมือง|การเมือง"]
},
{
  id: 3,
  cat: "สถานะและความสำคัญของ กสม.",
  q: "หลักการปารีสมีความสำคัญต่อ กสม. อย่างไร",
  a: "หลักการปารีสเป็นมาตรฐานสากลสำหรับสถาบันสิทธิมนุษยชนแห่งชาติ โดยกำหนดหลักสำคัญ เช่น ความเป็นอิสระ ความหลากหลาย ความโปร่งใส และประสิทธิภาพในการทำงาน กสม. ต้องดำเนินงานให้สอดคล้องกับหลักการนี้เพื่อให้ได้รับการยอมรับในระดับนานาชาติ และเพื่อให้การดำเนินงานคุ้มครองสิทธิมนุษยชนมีความน่าเชื่อถือและเป็นมืออาชีพ",
  keys: ["หลักการปารีส", "มาตรฐานสากล", "สถาบันสิทธิมนุษยชนแห่งชาติ", "ความเป็นอิสระ|อิสระ", "หลากหลาย", "โปร่งใส", "นานาชาติ|ยอมรับ"]
},
{
  id: 4,
  cat: "สถานะและความสำคัญของ กสม.",
  q: "อธิบายสถานะของ กสม. ตามรัฐธรรมนูญแห่งราชอาณาจักรไทย พ.ศ. 2560",
  a: "รัฐธรรมนูญกำหนดให้ กสม. เป็นองค์กรอิสระที่มีหน้าที่เกี่ยวกับการคุ้มครองและส่งเสริมสิทธิมนุษยชน รวมถึงการตรวจสอบและเสนอแนะเมื่อพบการละเมิดสิทธิ บทบัญญัติรัฐธรรมนูญจึงเป็นฐานทางกฎหมายที่รองรับอำนาจหน้าที่ของ กสม. และทำให้บทบาทขององค์กรนี้มีความมั่นคงและชัดเจนในระบบการปกครอง",
  keys: ["องค์กรอิสระ", "คุ้มครอง", "ส่งเสริม", "ตรวจสอบ", "เสนอแนะ", "ฐานทางกฎหมาย|บทบัญญัติ"]
},
{
  id: 5,

const ALL = QUESTIONS_A.concat(QUESTIONS_B);
const CATS = [...new Set(ALL.map(q => q.cat))];


const PASS = 70;
const HIT_THRESHOLD = 0.6; // สัดส่วนคำสำคัญที่ถือว่า "น่าจะได้คะแนน"

const S = {
  mode:'practice', count:'all', order:'seq',
  qs:[], i:0, screen:'start',
  ans:{},      // id -> ข้อความคำตอบ
  grade:{},    // id -> true/false
  checked:{},  // id -> true (กดตรวจแล้วในโหมดฝึก)
  gradeIdx:0
};

const app = document.getElementById('app');
const norm = s => (s||'').replace(/\s+/g,'').toLowerCase();

function keyHit(key, text){
  return key.split('|').some(k => norm(text).includes(norm(k)));
}
function coverage(q, text){
  if(!text || !text.trim()) return {hits:[], pct:0};
  const hits = q.keys.map(k => keyHit(k, text));
  const n = hits.filter(Boolean).length;
  return {hits, pct: Math.round(n / q.keys.length * 100)};
}
function esc(s){return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ================= start ================= */
function renderStart(){

    <div class="meta">

    </div>

        </button>
        <button class="modecard" id="m-exam" aria-pressed="${S.mode==='exam'}" onclick="setMode('exam')">
          <b>โหมดสอบ</b><small>ซ่อนคำสำคัญและเฉลยไว้จนเขียนครบ แล้วค่อยตรวจทีละข้อตอนจบ</small>
        </button>
      </div>
      <div class="optrow">
        <span>จำนวนข้อ</span>
        ${[10,20,30,'all'].map(n=>`<button class="chip" aria-pressed="${S.count==n}" onclick="setCount('${n}')">${n==='all'?'ทั้งหมด '+ALL.length:n+' ข้อ'}</button>`).join('')}
      </div>
      <div class="optrow">
        <span>ลำดับข้อ</span>
        <button class="chip" aria-pressed="${S.order==='seq'}" onclick="setOrder('seq')">ตามลำดับ</button>
        <button class="chip" aria-pressed="${S.order==='rand'}" onclick="setOrder('rand')">สุ่ม</button>
      </div>
    </div>

    <div class="note">คำตอบเก็บไว้ในหน้านี้เท่านั้น ถ้ารีเฟรชหรือปิดแท็บ คำตอบที่พิมพ์ไว้จะหายไป</div>

    <div style="margin-top:28px">
      <button class="btn btn-primary" onclick="start()">เริ่มทำข้อสอบ</button>
    </div>
  </div>`;
}
function setMode(m){S.mode=m;renderStart()}
function setCount(c){S.count=c;renderStart()}
function setOrder(o){S.order=o;renderStart()}

function start(){
  let pool = ALL.slice();
  if(S.order==='rand'){for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}}
  S.qs = S.count==='all' ? pool : pool.slice(0, parseInt(S.count,10));
  S.i=0; S.ans={}; S.grade={}; S.checked={}; S.gradeIdx=0;
  renderQuiz();
  window.scrollTo(0,0);
}

/* ================= quiz ================= */
function renderQuiz(){
  S.screen='quiz';
  const q = S.qs[S.i];
  const text = S.ans[q.id] || '';
  const cov = coverage(q, text);
  const revealed = S.mode==='practice' && S.checked[q.id];
  const answered = S.qs.filter(x => (S.ans[x.id]||'').trim()).length;

  app.innerHTML = `
  <div class="topbar"><div class="wrap">
    <span class="pill ${S.mode==='exam'?'exam':''}">${S.mode==='exam'?'โหมดสอบ':'โหมดฝึก'}</span>
    <div class="bar"><i style="width:${(S.i+1)/S.qs.length*100}%"></i></div>
    <span class="topcount">${S.i+1}/${S.qs.length}</span>
    <button class="iconbtn" onclick="openNav()">ผังข้อ</button>
  </div></div>

  <div class="wrap qwrap">
    <div class="qhead">
      <span class="qnum">ข้อ ${String(q.id).padStart(2,'0')}</span>
      <span class="eyebrow">${esc(q.cat)}</span>
    </div>
    <div class="qtext">${esc(q.q)}</div>

    <textarea id="ta" placeholder="เขียนคำตอบของคุณ… เขียนเป็นความเรียง ระบุประเด็นให้ครบและยกตัวอย่างประกอบ"
      oninput="onType()" ${revealed?'disabled':''}>${esc(text)}</textarea>

    <div class="keys ${(S.mode==='exam' && !revealed)?'masked':''}" id="keysbox">
      <div class="keys-head">
        <b>คำสำคัญที่ควรมีในคำตอบ</b>
        <span class="cov" id="covtxt">${cov.pct}% (${cov.hits.filter(Boolean).length}/${q.keys.length})</span>
      </div>
      <div class="keys-body" id="keysbody">
        ${q.keys.map((k,idx)=>`<span class="kw ${cov.hits[idx]?'hit':''}">${esc(k.split('|')[0])}</span>`).join('')}
      </div>
    </div>
    ${S.mode==='exam' && !revealed ? `<div class="hintline">คำสำคัญถูกซ่อนไว้ในโหมดสอบ จะเปิดให้ดูพร้อมเฉลยเมื่อส่งคำตอบครบแล้ว</div>`:''}

    <div class="actions">
      <button class="btn btn-ghost" onclick="go(-1)" ${S.i===0?'disabled':''}>ข้อก่อนหน้า</button>
      ${S.mode==='practice' && !revealed ? `<button class="btn btn-jade" onclick="checkNow()">ตรวจคำตอบข้อนี้</button>`:''}
      <div class="spacer"></div>
      ${S.i < S.qs.length-1
        ? `<button class="btn btn-primary" onclick="go(1)">ข้อถัดไป</button>`
        : `<button class="btn btn-primary" onclick="tryFinish()">ส่งคำตอบทั้งหมด</button>`}
    </div>

    ${revealed ? modelBlock(q, text) : ''}
    ${S.mode==='exam' ? `<div class="hintline">เขียนแล้ว ${answered} จาก ${S.qs.length} ข้อ</div>`:''}
  </div>`;
  const ta = document.getElementById('ta');
  if(ta && !revealed){ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length)}
}

function modelBlock(q, text){
  const cov = coverage(q, text);
  const suggest = cov.pct >= HIT_THRESHOLD*100;
  const g = S.grade[q.id];
  return `
  <div class="model">
    <span class="eyebrow">แนวคำตอบ</span>
    <p>${esc(q.a)}</p>
  </div>
  <div class="selfgrade">
    <p>เทียบกับแนวคำตอบแล้ว คำตอบของคุณครอบคลุมประเด็นหลักหรือไม่</p>
    <div class="gbtns">
      <button class="gbtn ok" aria-pressed="${g===true}" onclick="setGrade(${q.id},true)">ได้คะแนน</button>
      <button class="gbtn no" aria-pressed="${g===false}" onclick="setGrade(${q.id},false)">ยังไม่ครบ</button>
    </div>
    <div class="hintline">ระบบตรวจพบคำสำคัญ ${cov.pct}% — ${suggest?'เข้าเกณฑ์ที่น่าจะได้คะแนน':'ต่ำกว่าเกณฑ์ ลองอ่านเฉลยแล้วเขียนใหม่อีกรอบ'} (คำตัดสินสุดท้ายอยู่ที่คุณ)</div>
    <div style="margin-top:14px"><button class="btn btn-ghost" onclick="reopen(${q.id})">แก้ไขคำตอบข้อนี้</button></div>
  </div>`;
}

function onType(){
  const q = S.qs[S.i];
  const val = document.getElementById('ta').value;
  S.ans[q.id] = val;
  if(S.mode==='exam') return;
  const cov = coverage(q, val);
  document.getElementById('covtxt').textContent = `${cov.pct}% (${cov.hits.filter(Boolean).length}/${q.keys.length})`;
  [...document.getElementById('keysbody').children].forEach((el,idx)=>{
    el.classList.toggle('hit', !!cov.hits[idx]);
  });
}
function checkNow(){
  const q = S.qs[S.i];
  if(!(S.ans[q.id]||'').trim()){
    if(!confirm('ยังไม่ได้เขียนคำตอบ ต้องการดูเฉลยเลยหรือไม่')) return;
  }
  S.checked[q.id]=true;
  if(S.grade[q.id]===undefined){
    S.grade[q.id] = coverage(q, S.ans[q.id]||'').pct >= HIT_THRESHOLD*100;
  }
  renderQuiz();
}
function setGrade(id,v){S.grade[id]=v;renderQuiz()}
function reopen(id){delete S.checked[id];renderQuiz()}
function go(d){
  S.i = Math.max(0, Math.min(S.qs.length-1, S.i+d));
  renderQuiz(); window.scrollTo(0,0);
}
function jump(i){S.i=i;closeNav();renderQuiz();window.scrollTo(0,0)}

/* ================= navigator ================= */
function openNav(){
  const grid = document.getElementById('navgrid');
  grid.innerHTML = S.qs.map((q,idx)=>{
    let cls='gitem';
    if(S.grade[q.id]===true && (S.mode==='practice'? S.checked[q.id]:false)) cls+=' ok';
    else if(S.grade[q.id]===false && (S.mode==='practice'? S.checked[q.id]:false)) cls+=' no';
    else if((S.ans[q.id]||'').trim()) cls+=' written';
    if(idx===S.i) cls+=' cur';
    return `<button class="${cls}" onclick="jump(${idx})">${q.id}</button>`;
  }).join('');
  document.getElementById('navdrawer').classList.add('open');
}
function closeNav(){document.getElementById('navdrawer').classList.remove('open')}
function finishFromNav(){closeNav();tryFinish()}
document.getElementById('navdrawer').addEventListener('click',e=>{if(e.target.id==='navdrawer')closeNav()});

/* ================= finish ================= */
function tryFinish(){
  const blank = S.qs.filter(q=>!(S.ans[q.id]||'').trim()).length;
  if(blank>0 && !confirm(`ยังมี ${blank} ข้อที่ยังไม่ได้เขียนคำตอบ ข้อเหล่านี้จะถูกนับเป็นไม่ได้คะแนน ต้องการส่งเลยหรือไม่`)) return;
  if(S.mode==='exam'){ S.gradeIdx=0; renderGrading(); }
  else {
    S.qs.forEach(q=>{ if(S.grade[q.id]===undefined) S.grade[q.id]=false; });
    renderResults();
  }
  window.scrollTo(0,0);
}

/* โหมดสอบ: ตรวจทีละข้อตอนจบ */

        <div class="mine" style="background:#FBFAF7;border:1px solid var(--line);padding:12px 14px;border-radius:4px;white-space:pre-wrap;color:var(--ink-soft)">${text.trim()?esc(text):'<i style="color:#B6BDC9">ไม่ได้เขียนคำตอบ</i>'}</div>

        <div class="keys-body">${q.keys.map((k,i)=>`<span class="kw ${cov.hits[i]?'hit':''}">${esc(k.split('|')[0])}</span>`).join('')}</div>

          <button class="gbtn ok" aria-pressed="${g===true}" onclick="gradeSet(true)">ได้คะแนน</button>

        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="gradeGo(-1)" ${S.gradeIdx===0?'disabled':''}>ย้อนกลับ</button>
      <div class="spacer"></div>
      ${S.gradeIdx < S.qs.length-1
        ? `<button class="btn btn-primary" onclick="gradeGo(1)">ข้อถัดไป</button>`
        : `<button class="btn btn-primary" onclick="renderResults()">ดูผลคะแนน</button>`}

}
function gradeSet(v){S.grade[S.qs[S.gradeIdx].id]=v;renderGrading()}
function gradeGo(d){S.gradeIdx=Math.max(0,Math.min(S.qs.length-1,S.gradeIdx+d));renderGrading();window.scrollTo(0,0)}

/* ================= results ================= */
function renderResults(){
  S.screen='results';
  S.qs.forEach(q=>{ if(S.grade[q.id]===undefined) S.grade[q.id]=false; });
  const right = S.qs.filter(q=>S.grade[q.id]===true).length;
  const pct = Math.round(right/S.qs.length*100);
  const passed = pct >= PASS;
  const wrong = S.qs.filter(q=>S.grade[q.id]!==true);

  const cats = {};
  S.qs.forEach(q=>{
    cats[q.cat] = cats[q.cat] || {t:0,r:0};
    cats[q.cat].t++; if(S.grade[q.id]===true) cats[q.cat].r++;
  });

  app.innerHTML = `
  <div class="wrap res">
    <div class="verdict ${passed?'pass':'fail'}">
      <div class="eyebrow">ผลการทำข้อสอบ · ${S.mode==='exam'?'โหมดสอบ':'โหมดฝึก'}</div>
      <h2 style="margin-top:8px">${passed?'ผ่านเกณฑ์':'ยังไม่ผ่านเกณฑ์'}</h2>
      <div class="score">${pct}%</div>
      <div class="scoresub">ได้คะแนน ${right} จาก ${S.qs.length} ข้อ · เกณฑ์ผ่าน ${PASS}%</div>
      <div class="passline ${passed?'':'fail'}">
        <i style="width:${pct}%"></i><b></b><span>ผ่าน ${PASS}%</span>
      </div>
      <p style="margin:34px 0 0;color:var(--ink-soft);font-size:15px">
        ${passed
          ? 'ประเด็นหลักครบตามเกณฑ์แล้ว รอบต่อไปลองสลับเป็นโหมดสอบและจับเวลาเขียนข้อละ 5 นาที เพื่อฝึกความเร็วในห้องสอบ'
          : 'ยังขาดประเด็นในบางข้อ กดทบทวนข้อที่ยังไม่ได้คะแนนด้านล่าง แล้วลองเขียนใหม่เฉพาะข้อเหล่านั้น'}
      </p>
    </div>

    <div class="breakdown">
      <h3>แยกตามหมวดเนื้อหา</h3>
      ${Object.entries(cats).map(([c,v])=>{
        const p = Math.round(v.r/v.t*100);
        return `<div class="catrow">
          <span class="cname">${esc(c)}</span>
          <span class="catbar"><i style="width:${p}%;background:${p>=PASS?'var(--jade)':'var(--rust)'}"></i></span>
          <span class="catnum">${v.r}/${v.t}</span>
        </div>`;
      }).join('')}
    </div>

    <div class="reviewlist">
      <h3>ทบทวนข้อที่ยังไม่ได้คะแนน (${wrong.length} ข้อ)</h3>
      ${wrong.length===0 ? `<p style="color:var(--muted)">ได้คะแนนครบทุกข้อ</p>` : wrong.map(q=>{
        const t = S.ans[q.id]||'';
        return `<details class="rev no">
          <summary><span class="tag">ข้อ ${q.id}</span><span>${esc(q.q)}</span></summary>
          <div class="revbody">
            <div class="block"><h4>คำตอบของคุณ</h4>
              <div class="mine">${t.trim()?esc(t):'ไม่ได้เขียนคำตอบ'}</div></div>
            <div class="block"><h4>แนวคำตอบ</h4><p class="theirs">${esc(q.a)}</p></div>
            <div class="block"><h4>คำสำคัญที่ควรมี</h4>
              <div class="keys-body" style="padding:0;margin-top:6px">
                ${q.keys.map((k,i)=>`<span class="kw ${coverage(q,t).hits[i]?'hit':''}">${esc(k.split('|')[0])}</span>`).join('')}
              </div></div>
          </div>
        </details>`;
      }).join('')}
    </div>

    <div class="resact">
      ${wrong.length? `<button class="btn btn-jade" onclick="retryWrong()">ทำใหม่เฉพาะข้อที่ยังไม่ได้ (${wrong.length} ข้อ)</button>`:''}
      <button class="btn btn-primary" onclick="start()">ทำชุดเดิมอีกครั้ง</button>
      <button class="btn btn-ghost" onclick="renderStart()">กลับหน้าแรก</button>
      <button class="btn btn-ghost" onclick="window.print()">พิมพ์ผล</button>
    </div>
  </div>`;
}

function retryWrong(){
  const wrong = S.qs.filter(q=>S.grade[q.id]!==true);
  S.qs = wrong; S.i=0; S.gradeIdx=0;
  wrong.forEach(q=>{delete S.ans[q.id];delete S.grade[q.id];delete S.checked[q.id]});
  renderQuiz(); window.scrollTo(0,0);
}

document.addEventListener('keydown', e=>{
  if(e.target.tagName==='TEXTAREA') return;
  if(S.screen!=='quiz') return;
  if(e.key==='ArrowRight' && S.i<S.qs.length-1) go(1);
  if(e.key==='ArrowLeft' && S.i>0) go(-1);
});

renderStart();
</script>
</body>
</html>
