    q: "ข้อใดไม่ใช่ตัวชี้วัดยุทธศาสตร์ด้านการปรับสมดุลและพัฒนาระบบการบริหารจัดการภาครัฐ",
    opts: [
      "ระดับความพึงพอใจของประชาชนต่อการให้บริการสาธารณะของภาครัฐ",
      "ประสิทธิภาพของการบริการภาครัฐ",
      "ระดับความโปร่งใส การทุจริต ประพฤติมิชอบ",
      "ภาครัฐมีความโปร่งใส ปลอดการทุจริตและประพฤติมิชอบ",
      "ความเสมอภาคในกระบวนการยุติธรรม"
    ],
    a: 3,
    why: "ข้อ 4 เป็นเป้าหมาย ไม่ใช่ตัวชี้วัด"
  }
];

let i = 0, mode = "start";
const pick = Array(Q.length).fill(null);
const shown = Array(Q.length).fill(false);
const labels = ["1","2","3","4","5"];

function render(){
  const app = document.getElementById("app");
  if(mode==="start"){
    app.innerHTML = `
      <p style="margin-top:0;line-height:1.75">ชุดฝึก 30 ข้อจากเอกสาร <b>ข้อสอบชุดที่ 4 หัวข้อยุทธศาสตร์ชาติ</b> สำหรับตำแหน่งนักวิเคราะห์นโยบายและแผน</p>
      <p class="sub">เฉลยในไฟล์นี้อิงตัวบทอย่างเป็นทางการ ไม่ได้คัดลอกเฉลยจากเอกสารติว (ต้นฉบับไม่มีเฉลย)</p>
      <div class="btns">
        <button class="primary" onclick="mode='quiz';render()">เริ่มทำข้อสอบ</button>
      </div>`;
    return;
  }
  if(mode==="result"){
    let score=0;
    Q.forEach((q,n)=>{ if(pick[n]===q.a) score++; });
    app.innerHTML = `
      <div class="sub">ผลคะแนน</div>
      <div class="score">${score} / ${Q.length}</div>
      <div class="sub">${Math.round(score/Q.length*100)}%</div>
      <div class="btns">
        <button class="primary" onclick="mode='quiz';i=0;render()">ทบทวนทีละข้อ</button>
        <button class="ghost" onclick="restart()">เริ่มใหม่</button>
      </div>
      ${Q.map((q,n)=>`
        <div class="item">
          <b>ข้อ ${n+1}.</b> ${esc(q.q)}<br>
          คำตอบของคุณ: <span class="${pick[n]===q.a?'oktxt':'bad'}">${pick[n]==null?"ยังไม่ตอบ":((pick[n]+1)+") "+esc(q.opts[pick[n]]))}</span><br>
          เฉลย: <span class="oktxt">${q.a+1}) ${esc(q.opts[q.a])}</span><br>
          <span class="sub">${esc(q.why)}</span>
        </div>`).join("")}`;
    return;
  }
  const q = Q[i];
  app.innerHTML = `
    <div class="progress"><div class="bar" style="width:${(i/Q.length)*100}%"></div></div>
    <div class="meta"><span>ข้อ ${i+1} จาก ${Q.length}</span><span>ตอบแล้ว ${pick.filter(v=>v!==null).length} ข้อ</span></div>
    <div class="q">${i+1}. ${esc(q.q)}</div>
    <div id="opts"></div>
    <div class="note" id="note"></div>
    <div class="btns">
      <button class="ghost" onclick="if(i>0){i--;render()}">ก่อนหน้า</button>
      <button class="ghost" onclick="shown[i]=true;render()">เฉลยข้อนี้</button>
      ${i<Q.length-1
        ? `<button class="primary" onclick="i++;render()">ถัดไป</button>`
        : `<button class="primary" onclick="mode='result';render()">ตรวจคะแนน</button>`}
    </div>`;
  const box = document.getElementById("opts");
  q.opts.forEach((opt, n) => {
    const b = document.createElement("button");
    b.className = "opt" + (pick[i]===n ? " selected" : "");
    b.textContent = labels[n] + ")  " + opt;
    if(shown[i]){
      if(n===q.a) b.classList.add("correct");
      else if(pick[i]===n) b.classList.add("wrong");
    } else {
      b.onclick = () => { pick[i]=n; render(); };
    }
    box.appendChild(b);
  });
  if(shown[i]){
    const note = document.getElementById("note");
    note.className = "note show";
    note.innerHTML = (pick[i]===q.a ? "ถูกต้อง — " : "เฉลยข้อ "+(q.a+1)+" — ") + esc(q.why);
  }
}
function restart(){ for(let n=0;n<Q.length;n++){pick[n]=null;shown[n]=false;} mode="start"; i=0; render(); }
function esc(s){ return String(s).replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[m])); }
render();
</script>
</body>
</html>
